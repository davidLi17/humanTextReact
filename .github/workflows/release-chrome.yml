name: Release Chrome Web Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Chrome Web Store configuration
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$CWS_PUBLISHER_ID" ]] || { echo "::error::Missing repository variable CWS_PUBLISHER_ID"; exit 1; }
          [[ -n "$CWS_EXTENSION_ID" ]] || { echo "::error::Missing repository variable CWS_EXTENSION_ID"; exit 1; }
          [[ -n "$CWS_SERVICE_ACCOUNT_JSON" ]] || { echo "::error::Missing repository secret CWS_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Test fast layers
        run: bun run test:fast

      - name: Test shared order
        run: bun run test:shared

      - name: Test Sidepanel component
        run: bun run test:components

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build Chrome release zip
        id: package
        run: |
          set -euo pipefail
          bun run zip

          ZIP_PATH="$(find .output -maxdepth 1 -type f -name '*-chrome.zip' | head -n 1)"
          [[ -n "$ZIP_PATH" ]] || { echo "::error::Chrome zip was not generated"; exit 1; }

          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          MANIFEST_VERSION="$(unzip -p "$ZIP_PATH" manifest.json | jq -r '.version')"

          [[ "$PACKAGE_VERSION" == "$MANIFEST_VERSION" ]] || {
            echo "::error::Version mismatch: package.json=$PACKAGE_VERSION, packaged manifest=$MANIFEST_VERSION"
            exit 1
          }

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            [[ "$TAG_VERSION" == "$PACKAGE_VERSION" ]] || {
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION, package.json=$PACKAGE_VERSION"
              exit 1
            }
          fi

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared $ZIP_PATH (version $PACKAGE_VERSION)"

      # wxt zip already builds .output/chrome-mv3. Test that same build before upload.
      - name: Run extension E2E on release build
        run: bun run test:e2e:built

      - name: Keep release zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-language-translator-${{ steps.package.outputs.version }}-chrome
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Authenticate to Google
        id: auth
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          bun run .github/scripts/cws-auth.ts

      # 商店同一时间只允许一个版本处于审核状态。撞上时上传会返回 HTTP 400
      # NOT_UPDATEABLE「You may not edit or publish an item that is in review.」，
      # 表现为 curl 退出码 22 加一坨 JSON，翻日志才知道发生了什么。
      # 这里提前查一次状态，把它变成一句能看懂的话。
      - name: Check store state before upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API_BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"

          # 查询本身失败不阻断发布（可能只是瞬时网络问题），由上传步骤兜底。
          if ! curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${API_BASE}/v2/${ITEM}:fetchStatus" > /tmp/cws-preflight.json; then
            echo "::warning::无法查询商店状态，跳过预检（不影响后续上传）"
            exit 0
          fi

          STATE="$(jq -r '.submittedItemRevisionStatus.state // empty' /tmp/cws-preflight.json)"
          echo "submittedItemRevisionStatus.state = ${STATE:-（无已提交版本）}"

          if [[ "$STATE" == "PENDING_REVIEW" ]]; then
            echo "::error::商店里已有版本正在审核中（PENDING_REVIEW），本次无法上传。"
            echo "::error::Chrome Web Store 同一时间只允许一个版本处于审核状态。"
            echo "::error::处理方式：等上一个版本审核结束后，在 Actions 页面点 Re-run jobs 重跑本次运行（无需重新打 tag）。"
            exit 1
          fi

      - name: Upload package to Chrome Web Store
        id: upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail
          API_BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"

          # 预检与上传之间存在竞态（审核可能刚好在这一刻开始），
          # 因此这里同样把 NOT_UPDATEABLE 翻译成人话，而不是只留下 curl 退出码。
          if ! curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -X POST \
            -T "$ZIP_PATH" \
            "${API_BASE}/upload/v2/${ITEM}:upload" \
            > /tmp/cws-upload.json; then
            echo "::error::上传失败，商店返回：$(jq -r '.error.message // "（无法解析响应体）"' /tmp/cws-upload.json 2>/dev/null || echo '（无法解析响应体）')"
            if jq -e '[.error.details[]?.reason] | index("NOT_UPDATEABLE")' /tmp/cws-upload.json > /dev/null 2>&1; then
              echo "::error::原因：该条目有版本正在审核中，商店不允许同时上传新版本。请等审核结束后重跑本次运行。"
            fi
            echo "--- 完整响应体 ---"
            cat /tmp/cws-upload.json
            exit 1
          fi

          cat /tmp/cws-upload.json

          STATE="$(jq -r '.uploadState // empty' /tmp/cws-upload.json)"
          echo "Initial upload state: ${STATE:-unknown}"

          if [[ "$STATE" == "IN_PROGRESS" || "$STATE" == "UPLOAD_IN_PROGRESS" ]]; then
            for attempt in {1..30}; do
              sleep 10
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${API_BASE}/v2/${ITEM}:fetchStatus" \
                > /tmp/cws-status.json

              STATE="$(jq -r '.lastAsyncUploadState // empty' /tmp/cws-status.json)"
              echo "Upload state (${attempt}/30): ${STATE:-unknown}"

              if [[ "$STATE" != "IN_PROGRESS" && "$STATE" != "UPLOAD_IN_PROGRESS" ]]; then
                break
              fi
            done
          fi

          case "$STATE" in
            SUCCEEDED|UPLOAD_SUCCEEDED|SUCCESS)
              echo "Chrome Web Store upload succeeded."
              ;;
            IN_PROGRESS|UPLOAD_IN_PROGRESS)
              echo "::error::Chrome Web Store upload did not finish within 5 minutes."
              exit 1
              ;;
            *)
              echo "::error::Chrome Web Store upload failed or returned an unexpected state: ${STATE:-empty}"
              cat /tmp/cws-upload.json
              [[ -f /tmp/cws-status.json ]] && cat /tmp/cws-status.json
              exit 1
              ;;
          esac

      - name: Submit update for review and automatic publication
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API_BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"publishType":"DEFAULT_PUBLISH","skipReview":false,"blockOnWarnings":false}' \
            "${API_BASE}/v2/${ITEM}:publish" \
            | tee /tmp/cws-publish.json

          echo "Submitted version ${{ steps.package.outputs.version }} to Chrome Web Store review."
